<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Vehículos - Guía Pareca</title>
    <!-- TailwindCSS v3.4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tus estilos personalizados -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100"> <!-- Fondo del resto del sitio -->

    <!-- Sección de Portada -->
    <div id="cover-page" class="flex flex-col items-center justify-between min-h-screen bg-gray-800 bg-opacity-90 p-4">
        <!-- Parte superior vacía -->
        <div></div>

        <!-- Contenido central -->
        <div class="text-center bg-white bg-opacity-80 p-6 rounded-xl shadow-lg max-w-2xl mx-auto border-2 border-gray-700">
            <div class="mb-4">
                <!-- Emblema de LA LEGIÓN ESPAÑOLA -->
                <img src="imagenes/emblema_legion.png" alt="Emblema de LA LEGIÓN ESPAÑOLA" class="mx-auto h-64 w-auto object-contain">
            </div>
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-6">GRUPO DE CABALLERÍA "REYES CATÓLICOS" II DE LA LEGIÓN</h1>
            <button id="start-button" class="mt-2 px-8 py-4 bg-blue-700 text-white font-bold text-xl rounded-lg hover:bg-blue-800 transition-all duration-300 transform hover:scale-105 shadow-md border border-gray-800">
                COMENZAR TEST
            </button>
            
            <!-- Nombre del autor debajo del botón -->
            <div class="mt-6 pt-4 border-t border-gray-400">
                <p class="text-lg font-bold text-gray-800">Autor: TTE. JOSE REVERT TORMO</p>
            </div>
        </div>

        <!-- Pie de la portada (opcional, puedes eliminarlo si no lo quieres) -->
        <footer class="mt-6 text-center text-gray-400 text-sm">
            <p>Proyecto para GitHub Pages - Basado en la Guía Pareca</p>
        </footer>
    </div>

    <!-- Sección del Quiz (oculta inicialmente) -->
    <div id="quiz-section" class="hidden">
        <!-- BARRA SUPERIOR CON TÍTULO (arriba del todo) -->
        <div class="bg-blue-600 text-white py-3 shadow-md">
            <div class="container mx-auto px-4 max-w-4xl">
                <h1 class="text-3xl font-bold text-center">Test de Vehículos - Guía Pareca</h1>
            </div>
        </div>
        
        <!-- CONTENIDO PRINCIPAL -->
        <div class="container mx-auto px-4 py-6 max-w-4xl">
            <div id="quiz-container" class="bg-white rounded-xl shadow-md p-6">
                <!-- Aquí se cargará la pregunta dinámicamente -->
            </div>
            
            <div id="result-container" class="hidden bg-white rounded-xl shadow-md p-6 text-center mt-6">
                <!-- Aquí se mostrará el resultado final -->
            </div>

            <footer class="mt-8 text-center text-gray-500 text-sm">
                <p>Proyecto para GitHub Pages - Basado en la Guía Pareca.</p>
            </footer>
        </div>
    </div>

    <!-- Tu script principal -->
    <script src="js/script.js"></script>
</body>
</html>
